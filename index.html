<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>폰쉼 스마트폰 과의존 자가진단</title>
  <link rel="stylesheet" href="style/style.css">
</head>
<body>
  <div class="shell">
    <section class="app" aria-live="polite">
      <header class="topbar">
        <div class="brand">
          <img class="logo" src="https://avatars.githubusercontent.com/u/297063426?s=400&amp;u=5b3a39bf56631f8d26a0f64d78f9d2e005af00a4&amp;v=4" alt="폰쉼 로고">
          <span>폰쉼 - 자가진단</span>
        </div>
        <div class="progress-wrap">
          <div class="progress-label">
            <span id="stepText">시작</span>
            <span id="countText">0/15</span>
          </div>
          <div class="progress"><div class="bar" id="bar"></div></div>
        </div>
      </header>

      <main>
        <section class="screen intro active" id="intro">
          <div class="intro-copy">
            <h1>스마트폰 과의존 자가진단</h1>
            <p>최근 스마트폰 사용 후 경험을 떠올리며 가장 가까운 답을 골라주세요. 총 15문항이며, 한 문항씩 차분히 진행됩니다.</p>
            <div class="actions">
              <button class="btn primary" id="startBtn" type="button">진단 시작</button>
            </div>
          </div>
          <div class="intro-art" aria-hidden="true">
            <img class="mascot" src="image/mascot-heart.png" alt="">
          </div>
        </section>

        <section class="screen" id="questionScreen">
          <div class="question-meta">
            <span class="pill" id="domainText">생활 영향</span>
            <span id="questionIndex">1 / 15</span>
          </div>
          <h2 id="questionText"></h2>
          <div class="answers" id="answers"></div>
          <div class="actions">
            <button class="btn ghost" id="prevBtn" type="button">이전</button>
            <button class="btn primary" id="nextBtn" type="button" disabled>다음</button>
          </div>
        </section>

        <section class="screen result-layout" id="resultScreen">
          <div class="result-visual">
            <img class="result-mascot" id="resultMascot" src="image/mascot-usage-time.png" alt="">
            <div class="score-ring" id="scoreRing" style="--score-pct: 0">
              <div class="score">
                <b id="scoreValue">0</b>
                <small>총점 / 60점</small>
              </div>
            </div>
          </div>
          <div class="result-copy">
            <div class="level" id="levelText">결과</div>
            <h2 id="resultTitle"></h2>
            <p id="resultDescription"></p>
            <div class="actions">
              <button class="btn ghost" id="reviewBtn" type="button">답변 보기</button>
              <button class="btn primary" id="restartBtn" type="button">다시 진단</button>
            </div>
          </div>
        </section>
      </main>
    </section>
  </div>

  <script>
    const questions = [
      { text: "스마트폰의 지나친 사용으로 학교 성적이나 업무능력이 떨어진다.", domain: "일상생활장애" },
      { text: "스마트폰을 사용하지 못하면 온 세상을 잃을 것 같은 생각이 든다.", domain: "금단" },
      { text: "스마트폰을 사용할 때, '그만해야지'라고 생각은 하면서도 계속한다.", domain: "조절 실패" },
      { text: "스마트폰이 없어도 불안하지 않다.", domain: "역채점", reverse: true },
      { text: "수시로 스마트폰을 사용하다가 지적을 받은 적이 있다.", domain: "일상생활장애" },
      { text: "가족이나 친구들과 함께 있는 것보다 스마트폰을 사용하는 것이 더 즐겁다.", domain: "가상세계지향" },
      { text: "스마트폰 사용 시간을 줄이려고 해보았지만 실패한다.", domain: "조절 실패" },
      { text: "스마트폰을 사용할 수 없게 된다면 견디기 힘들 것이다.", domain: "금단" },
      { text: "스마트폰을 너무 자주 또는 오래 한다고 가족이나 친구들로부터 불평을 들은 적이 있다.", domain: "일상생활장애" },
      { text: "스마트폰 사용에 많은 시간을 보내지 않는다.", domain: "역채점", reverse: true },
      { text: "스마트폰이 옆에 없으면, 온종일 일 또는 공부가 손에 안 잡힌다.", domain: "금단" },
      { text: "스마트폰을 사용하느라 지금 하는 일 또는 공부에 집중이 안 된 적이 있다.", domain: "일상생활장애" },
      { text: "스마트폰 사용에 많은 시간을 보내는 것이 습관화되었다.", domain: "내성" },
      { text: "스마트폰이 없으면 안절부절못하고 초조해진다.", domain: "금단" },
      { text: "스마트폰 사용이 지금 하는 일 또는 공부에 방해가 되지 않는다.", domain: "역채점", reverse: true }
    ];

    const options = [
      { label: "전혀 그렇지 않다", score: 1 },
      { label: "그렇지 않다", score: 2 },
      { label: "그렇다", score: 3 },
      { label: "매우 그렇다", score: 4 }
    ];

    let current = 0;
    let answers = Array(questions.length).fill(null);

    const intro = document.querySelector("#intro");
    const questionScreen = document.querySelector("#questionScreen");
    const resultScreen = document.querySelector("#resultScreen");
    const stepText = document.querySelector("#stepText");
    const countText = document.querySelector("#countText");
    const bar = document.querySelector("#bar");
    const domainText = document.querySelector("#domainText");
    const questionIndex = document.querySelector("#questionIndex");
    const questionText = document.querySelector("#questionText");
    const answersEl = document.querySelector("#answers");
    const prevBtn = document.querySelector("#prevBtn");
    const nextBtn = document.querySelector("#nextBtn");

    function show(screen) {
      [intro, questionScreen, resultScreen].forEach((el) => el.classList.remove("active"));
      screen.classList.add("active");
    }

    function updateProgress() {
      const answered = answers.filter((value) => value !== null).length;
      const progress = Math.round((answered / questions.length) * 100);
      bar.style.width = progress + "%";
      countText.textContent = answered + "/" + questions.length;
      stepText.textContent = resultScreen.classList.contains("active") ? "완료" : "진행 중";
    }

    function fitTextToBox(element, maxSize, minSize) {
      element.style.fontSize = maxSize + "px";
      let size = maxSize;
      while ((element.scrollHeight > element.clientHeight || element.scrollWidth > element.clientWidth) && size > minSize) {
        size -= 1;
        element.style.fontSize = size + "px";
      }
    }

    function fitAllText() {
      const compactDesktop = window.innerWidth > 760 && window.innerHeight <= 900;
      const questionMax = window.innerWidth <= 760 ? 34 : compactDesktop ? 40 : 46;
      const questionMin = window.innerWidth <= 760 ? 24 : compactDesktop ? 29 : 32;
      const answerMax = window.innerWidth <= 760 ? 17 : compactDesktop ? 17 : 19;
      fitTextToBox(questionText, questionMax, questionMin);
      document.querySelectorAll(".answer strong").forEach((label) => {
        fitTextToBox(label, answerMax, 14);
      });
      const resultTitle = document.querySelector("#resultTitle");
      if (resultTitle.textContent.trim()) {
        fitTextToBox(resultTitle, questionMax, questionMin);
      }
    }

    function renderQuestion() {
      const item = questions[current];
      domainText.textContent = item.domain;
      questionIndex.textContent = (current + 1) + " / " + questions.length;
      questionText.textContent = item.text;
      answersEl.innerHTML = "";

      options.forEach((option, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer" + (answers[current] === index ? " selected" : "");
        button.innerHTML = "<strong>" + option.label + "</strong><span>" + option.score + "</span>";
        button.addEventListener("click", () => {
          answers[current] = index;
          renderQuestion();
          setTimeout(() => {
            if (current < questions.length - 1) {
              current += 1;
              renderQuestion();
            } else {
              showResult();
            }
          }, 230);
        });
        answersEl.appendChild(button);
      });

      requestAnimationFrame(fitAllText);
      prevBtn.disabled = current === 0;
      nextBtn.disabled = answers[current] === null;
      nextBtn.textContent = current === questions.length - 1 ? "결과 보기" : "다음";
      updateProgress();
    }

    function scoreAnswer(question, selectedIndex) {
      const raw = selectedIndex + 1;
      return question.reverse ? 5 - raw : raw;
    }

    function getTotal() {
      return answers.reduce((sum, selectedIndex, index) => {
        if (selectedIndex === null) return sum;
        return sum + scoreAnswer(questions[index], selectedIndex);
      }, 0);
    }

    function classify(total) {
      if (total >= 44) {
        return {
          level: "고위험사용자군",
          color: "#f26d5b",
          image: "image/mascot-sleep.png",
          title: "폰쉼으로 사용을 잠시 멈춰볼 때입니다",
          description: "스마트폰 과의존 경향성이 높게 나타났습니다. 폰쉼 앱으로 사용 시간과 휴식 시간을 나누고, 잠금이나 집중 모드를 활용해 바로 쉬는 환경을 만들어보세요. 일상생활의 어려움이 계속된다면 전문가 상담도 함께 권합니다."
        };
      }
      if (total >= 40) {
        return {
          level: "잠재적위험사용자군",
          color: "#f5a623",
          image: "image/mascot-cheer.png",
          title: "폰쉼으로 사용 패턴을 정리해보세요",
          description: "필요 이상으로 사용 시간이 길어지거나 집착이 커질 수 있는 단계입니다. 폰쉼 앱에서 목표 사용 시간과 휴식 알림을 설정해두면, 무심코 이어지는 사용을 끊고 계획적인 스마트폰 습관을 만들기 쉽습니다."
        };
      }
      return {
        level: "일반사용자군",
        color: "#1f8a8a",
        image: "image/mascot-usage-time.png",
        title: "폰쉼으로 좋은 습관을 유지하세요",
        description: "스마트폰 과의존 문제가 뚜렷하게 나타나지 않습니다. 지금의 안정적인 사용을 유지할 수 있도록 폰쉼 앱으로 가벼운 사용 점검과 휴식 알림을 설정해보세요."
      };
    }

    function showResult() {
      const total = getTotal();
      const result = classify(total);
      document.querySelector("#scoreValue").textContent = total;
      document.querySelector("#scoreRing").style.setProperty("--score-pct", Math.round((total / 60) * 100));
      document.querySelector("#scoreRing").style.background = "conic-gradient(" + result.color + " calc(var(--score-pct) * 1%), #e9efeb 0)";
      document.querySelector("#levelText").textContent = result.level;
      document.querySelector("#levelText").style.background = result.color;
      document.querySelector("#resultTitle").textContent = result.title;
      document.querySelector("#resultDescription").textContent = result.description;
      document.querySelector("#resultMascot").src = result.image;
      show(resultScreen);
      updateProgress();
      requestAnimationFrame(fitAllText);
    }

    document.querySelector("#startBtn").addEventListener("click", () => {
      current = 0;
      show(questionScreen);
      renderQuestion();
    });

    prevBtn.addEventListener("click", () => {
      if (current > 0) {
        current -= 1;
        renderQuestion();
      }
    });

    nextBtn.addEventListener("click", () => {
      if (answers[current] === null) return;
      if (current < questions.length - 1) {
        current += 1;
        renderQuestion();
      } else {
        showResult();
      }
    });

    document.querySelector("#restartBtn").addEventListener("click", () => {
      answers = Array(questions.length).fill(null);
      current = 0;
      show(intro);
      updateProgress();
    });

    document.querySelector("#reviewBtn").addEventListener("click", () => {
      current = 0;
      show(questionScreen);
      renderQuestion();
    });

    window.addEventListener("resize", fitAllText);

    updateProgress();
  </script>
</body>
</html>
